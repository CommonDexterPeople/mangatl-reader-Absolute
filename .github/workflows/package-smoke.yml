name: Packaged build smoke test

# Builds the Windows artifact and runs it.
#
# WHY THIS IS SEPARATE FROM ci.yml
#   ci.yml validates the SOURCE tree, on Ubuntu, in seconds. It cannot catch
#   anything about the packaged build, and two real defects proved that:
#   the exe recommended an OCR engine it did not contain, and /ocr-crop
#   returned 500 "No module named 'easyocr'" the first time a user corrected
#   a bubble by hand. Both were invisible from a source install, where
#   easyocr IS importable.
#
# WHY IT IS NOT ON EVERY PR
#   It needs a Windows runner and a ~250MB PyInstaller build — minutes, not
#   seconds, and most PRs cannot affect the artifact. So: on demand, and
#   automatically on a release tag, which is the moment it actually matters.
#   Run it manually before cutting a release, or after touching packaging/,
#   server.py's engine resolution, or anything lazily imported.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  smoke:
    name: Build the exe and exercise it
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      # Needed only by the release step below. Everything else here
      # reads, so this is the narrowest grant that still works.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the packaged build's dependencies
        # Deliberately NOT easyocr/torch. Installing them here would let
        # PyInstaller follow a transitive import back into torch and quietly
        # undo the spec's excludes — the bundle would build, pass, and ship
        # at 900MB. The smoke test asserts their absence, but not installing
        # them in the first place is the stronger guarantee.
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller flask requests opencv-python-headless numpy pillow rapidocr onnxruntime

      - name: Build the single-file source bundle
        run: python build.py

      - name: Build the Windows executable
        run: pyinstaller packaging/MangaTL-Reader.spec --noconfirm --distpath packaging/out --workpath packaging/work

      - name: Smoke-test the executable
        # Starts the exe, does real OCR through it, and stops it. Exits
        # non-zero on any failed check, which fails this job.
        run: python packaging/smoke_test.py packaging/out/MangaTL-Reader/MangaTL-Reader.exe

      - name: Report bundle size
        # Not a gate — a number to eyeball. A sudden jump from ~250MB is the
        # signature of an exclusion having stopped working.
        run: |
          $size = (Get-ChildItem -Recurse packaging/out/MangaTL-Reader | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Output ("bundle size: {0:N0} MB" -f $size)

      - name: Upload the build
        # Keeps the artifact that was actually tested, so a release can ship
        # the exact bytes CI exercised rather than a local rebuild.
        uses: actions/upload-artifact@v4
        with:
          name: MangaTL-Reader-windows
          path: packaging/out/MangaTL-Reader
          retention-days: 14

      # ── Installer ────────────────────────────────────────────────────────
      # Deliberately runs on workflow_dispatch as well as on tags. If it only
      # ran on tags, the first time anyone found out the .iss was broken would
      # be the tag that was supposed to produce a release -- and unpicking a
      # bad tag is far more annoying than a failed manual run. This way the
      # installer is provably buildable before any tag exists.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        # Version comes from the tag (v1.2.3 -> 1.2.3) so the installer's
        # Add/Remove Programs entry matches the release. Falls back to the
        # .iss default on a manual run, where there is no tag.
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          Write-Output "building installer version $ver"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=$ver packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-ChildItem packaging/Output

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: MangaTL-Reader-Setup
          path: packaging/Output/*.exe
          retention-days: 14

      # ── Release (tags only) ──────────────────────────────────────────────
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # Draft, always: artifacts attached and notes written, but a human
        # decides when it goes public. Re-running on the same tag updates the
        # existing draft's assets rather than failing, so a re-run is never a
        # dead end.
        #
        # The notes use a LITERAL here-string (@'...'@). A double-quoted one
        # would treat every backtick as an escape character and quietly eat
        # the markdown code spans below.
        #
        # No --generate-notes: it generates a title too, which fights --title.
        # The draft UI has a "Generate release notes" button if you want the
        # commit list appended by hand.
        run: |
          $notes = @'
          ## Downloads

          | File | For |
          |---|---|
          | `MangaTL-Reader-Setup.exe` | **Windows, most people.** Installs to your user profile with a Start Menu shortcut, no admin prompt. Ready to read immediately — no dependency install, no model download. |
          | `MangaTL-Reader.py` | **Any OS with Python 3.11+.** Double-click it, or `python MangaTL-Reader.py`. First run installs its own dependencies (a few minutes — EasyOCR pulls in PyTorch); EasyOCR then fetches a language model the first time you OCR a page. |

          Both need a free **Gemini** or **DeepSeek** API key for translation — see the README.

          **Windows will warn about an unknown publisher.** The installer is unsigned (a certificate is an annual cost this project does not carry): choose **More info → Run anyway**.

          The installer ships **RapidOCR only**; the `.py` build also includes EasyOCR. `packaging/README.md` explains the trade.

          Every file here was built and smoke-tested by CI on this tag.
          '@
          # WriteAllText with UTF8Encoding($false) rather than Out-File:
          # Out-File -Encoding utf8 emits a BOM under Windows PowerShell,
          # and gh would paste that BOM into the release notes as a stray
          # character. This writes the same bytes under either shell.
          [System.IO.File]::WriteAllText("$PWD/notes.md", $notes, (New-Object System.Text.UTF8Encoding $false))

          $installer = (Get-ChildItem packaging/Output/*.exe | Select-Object -First 1).FullName
          if (-not $installer) { throw "no installer found in packaging/Output" }
          Write-Output "attaching: $installer"

          gh release view $env:GITHUB_REF_NAME --json id *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "release $env:GITHUB_REF_NAME exists - replacing assets"
            gh release upload $env:GITHUB_REF_NAME $installer dist/MangaTL-Reader.py --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME --draft --title "MangaTL Reader $env:GITHUB_REF_NAME" --notes-file notes.md $installer dist/MangaTL-Reader.py
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
