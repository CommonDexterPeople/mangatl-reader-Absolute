name: CI

# Runs the project's test suites on every push and PR.
#
# The tests import server.py directly (importlib) and call the real
# functions. That works because server.py's dependency auto-installer is
# guarded behind `if __name__ == "__main__"` — importing the module never
# shells out to pip. They therefore need server.py's MODULE-SCOPE deps
# installed, which is the short list below.
#
# Deliberately NOT installed: easyocr, rapidocr, torch. Those are loaded
# lazily inside _get_reader() / _get_rapidocr_engine() / _get_lama_engine(),
# and no test reaches them — so CI stays at a ~100 MB install that finishes
# in seconds instead of a multi-GB torch pull.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # server.py's module-scope imports, and nothing else.
  SERVER_DEPS: flask requests opencv-python-headless numpy pillow

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check server.py and the mtl/ package
        run: |
          set -e
          for f in server.py mtl/*.py; do
            echo "Checking $f"
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1],encoding='utf-8').read())" "$f"
          done

      - name: Install server.py's module-scope dependencies
        run: python3 -m pip install --quiet $SERVER_DEPS

      - name: Confirm server.py imports without triggering the pip bootstrap
        # Regression guard for the __main__ guard itself: if someone ever
        # un-guards _bootstrap(), this step hangs/installs instead of
        # returning instantly, and every test below goes back to needing
        # source-scraping hacks to avoid it.
        run: |
          python3 - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("mangatl_server", "server.py")
          m = importlib.util.module_from_spec(spec)
          sys.modules["mangatl_server"] = m
          spec.loader.exec_module(m)
          for fn in ("_is_allowed_image_host", "_rescue_json_from_reasoning",
                     "_merge_bubble_regions", "typeset_page",
                     # Geometry + merge moved to mtl/ but must stay reachable
                     # from server: every existing test imports them there.
                     "_find_bubble_components", "_waist_separates_boxes",
                     "compute_merge_margins", "group_fragment_boxes",
                     "assemble_region", "VetoSet"):
              assert hasattr(m, fn), f"server.py no longer exposes {fn}"
          print("server.py imported cleanly")
          PY

      - name: SSRF guard tests (test_ssrf_guard.py)
        run: python3 test_ssrf_guard.py

      - name: DeepSeek rescue regression tests (test_deepseek_rescue.py)
        run: python3 test_deepseek_rescue.py

      - name: Side-by-side bubble merge tests (test_side_by_side_bubble_merge.py)
        run: python3 test_side_by_side_bubble_merge.py

      - name: Bubble outline tracing tests (test_bubble_outline_tracing.py)
        run: python3 test_bubble_outline_tracing.py

      - name: Fused bubble waist tests (test_fused_bubble_waist.py)
        run: python3 test_fused_bubble_waist.py

      - name: Adjacent container gap tests (test_adjacent_container_gap.py)
        run: python3 test_adjacent_container_gap.py

      - name: Merge stage unit tests (test_merge_stages.py)
        # Stage-level cover for mtl/merge.py. The five suites above drive the
        # whole pipeline and assert on final regions, so any broken stage
        # shows up there as the same off-by-one region count; this one names
        # the stage that broke.
        run: python3 test_merge_stages.py

      - name: Model registry consistency (test_model_registry.py)
        # The picker, MODEL_INFO and rates.json must agree about every model.
        # Pure stdlib text parsing, so it runs alongside the Python tests even
        # though two of the three files it reads are frontend ones.
        run: python3 test_model_registry.py

      - name: innerHTML escaping audit (informational — does not fail the build)
        run: python3 audit_innerhtml.py

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every static/js/*.js file parses as an ES module
        # static/js is ES modules now, so `node --check <file>` is wrong: it
        # treats a .js file as a classic script, where import/export is a
        # syntax error. Feeding the file on stdin with --input-type=module
        # checks it as what it actually is.
        run: |
          set -e
          for f in static/js/*.js; do
            echo "Checking $f"
            node --input-type=module --check < "$f"
          done

      - name: Confirm index.html loads exactly one module entry point
        # The whole point of the module conversion is that load order lives in
        # main.js's imports, not in a list of <script> tags here. If someone
        # re-adds a plain <script src="/static/js/…"> tag, build.py's flattening
        # would silently miss it.
        run: |
          set -e
          plain=$(grep -c '<script src="/static/js/' static/index.html || true)
          if [ "$plain" != "0" ]; then
            echo "index.html has $plain plain <script src=\"/static/js/...\"> tag(s); expected 0 — modules load via main.js"
            exit 1
          fi
          entry=$(grep -c '<script type="module" src="/static/js/main.js">' static/index.html || true)
          if [ "$entry" != "1" ]; then
            echo "expected exactly 1 module entry tag for main.js, found $entry"
            exit 1
          fi
          echo "one module entry point, no stray script tags"

  build-check:
    name: build.py reassembly check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server.py's module-scope dependencies
        run: python3 -m pip install --quiet $SERVER_DEPS

      - name: Run build.py and confirm dist output is produced
        run: |
          python3 build.py
          test -f dist/MangaTL-Reader.py
          python3 -c "import ast; ast.parse(open('dist/MangaTL-Reader.py').read())"

      - name: Confirm dist has no leftover mtl imports
        # build.py must INLINE mtl/*.py, not import it. A dist that still says
        # `from mtl.… import …` parses fine but dies with ModuleNotFoundError
        # for the one audience it exists for: someone who downloaded a single
        # file. Catch that here rather than in their traceback.
        run: |
          if grep -nE '^(from mtl|import mtl)' dist/MangaTL-Reader.py; then
            echo "dist/MangaTL-Reader.py still imports the mtl package — build.py did not inline it"
            exit 1
          fi
          echo "no mtl imports in dist"

      - name: Confirm dist imports standalone
        run: |
          mkdir -p /tmp/diststandalone
          cp dist/MangaTL-Reader.py /tmp/diststandalone/
          cd /tmp/diststandalone
          python3 -c "import importlib.util,sys; spec=importlib.util.spec_from_file_location('d','MangaTL-Reader.py'); m=importlib.util.module_from_spec(spec); sys.modules['d']=m; spec.loader.exec_module(m); print('dist imports standalone with', len(list(m.app.url_map.iter_rules())), 'routes')"
