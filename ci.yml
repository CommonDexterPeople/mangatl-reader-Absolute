name: CI

# Runs the project's existing test suites on every push and PR.
# Both test_*.py files are intentionally stdlib-only (they extract the
# logic under test straight out of server.py via source parsing, rather
# than importing the whole module) — so this workflow needs no
# `pip install` step at all and finishes in seconds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python-tests:
    name: Python regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: server.py syntax check
        run: python3 -c "import ast; ast.parse(open('server.py').read())"

      - name: SSRF guard tests (test_ssrf_guard.py)
        run: python3 test_ssrf_guard.py

      - name: DeepSeek rescue regression tests (test_deepseek_rescue.py)
        run: python3 test_deepseek_rescue.py

      - name: innerHTML escaping audit (informational — does not fail the build)
        run: python3 audit_innerhtml.py

  js-syntax:
    name: JS syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check every static/js/*.js file parses
        run: |
          set -e
          for f in static/js/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  build-check:
    name: build.py reassembly check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run build.py and confirm dist output is produced
        run: |
          python3 build.py
          test -f dist/MangaTL-Reader.py
          python3 -c "import ast; ast.parse(open('dist/MangaTL-Reader.py').read())"
